<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're Invited | Jessica &amp; Daniel &middot; 18 October 2026</title>
<meta name="description" content="Jessica &amp; Daniel invite you to celebrate their wedding on Sunday 18 October 2026 at Zest Waterfront Venues, Mosman, Sydney.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600&family=Herr+Von+Muellerhoff&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/invite.css">
</head>
<body>

<div class="invite-stage">
  <div class="invite-layout">

    <div class="invite-frame" id="inviteFrame">
      <div class="flip-trigger" id="flipTrigger" role="button" tabindex="0" aria-label="Reveal your invitation">
        <div class="flip-inner" id="flipInner">

          <!-- Front: gold face, shown first -->
          <div class="flip-face flip-front">
            <img src="images/invite2front.jpeg" alt="You're invited! Tap to reveal." class="invite-image">
          </div>

          <!-- Back: the actual invitation artwork -->
          <div class="flip-face flip-back">
            <img src="images/invite2back.jpeg" alt="Jessica and Daniel's wedding invitation" class="invite-image" id="inviteImage">
          </div>

        </div>
      </div>
    </div>

    <!-- Actions: sit beside the card, fade in once it has turned over -->
    <div class="invite-actions">
      <a href="index.html" class="btn btn-primary">Event Details &amp; Registry</a>
      <a href="https://forms.gle/gH3tYv1dDQS2jbG3A" class="btn btn-primary" target="_blank" rel="noopener">RSVP</a>
    </div>

  </div>
</div>

<script src="js/invite.js"></script>
</body>
</html>
